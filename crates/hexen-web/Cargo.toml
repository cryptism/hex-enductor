[package]
name = "hexen-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "Leptos pieces shared by the Rust front ends: the map canvas and the hexend live-session client."

[dependencies]
hexen-proto = { path = "../hexen-proto" }
map-core = { path = "../map-core" }
leptos = { version = "0.8", features = ["csr"] }
# Pinned to the wasm-bindgen-cli the flake's nixpkgs ships
# (wasm-bindgen-cli_0_2_127) — trunk needs the CLI and this crate to
# match exactly, and a trunk-downloaded CLI binary won't run on NixOS.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "CanvasRenderingContext2d",
    "CloseEvent",
    "console",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlDivElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "MessageEvent",
    "PointerEvent",
    "WebSocket",
    "WheelEvent",
    "Window",
]
