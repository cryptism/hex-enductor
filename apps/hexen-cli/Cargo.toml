[package]
name = "hexen-cli"
version = "0.0.0"
edition = "2021"
publish = false
description = "Project maintenance commands: import an Obsidian vault, migrate old-format projects, regenerate the link icons and the JSON Schema."

[[bin]]
name = "hexen"
path = "src/main.rs"

[dependencies]
hexen-proto = { path = "../../crates/hexen-proto" }
project-ops = { path = "../../crates/project-ops" }
clap = { version = "4", features = ["derive"] }
prost = "0.13"
prost-types = "0.13"
serde_json = "1"
serde_yml = "0.0.12"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["platform-verifier"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
