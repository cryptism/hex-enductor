[package]
name = "hexend"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "hexend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
hexen-proto = { path = "../../crates/hexen-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
futures-util = "0.3"
path-clean = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
