[package]
name = "editor"
version = "0.0.0"
edition = "2021"
publish = false
description = "The hex-enductor map editor (Leptos, client-side)."

[dependencies]
hexen-proto = { path = "../../crates/hexen-proto" }
hexen-web = { path = "../../crates/hexen-web" }
map-core = { path = "../../crates/map-core" }
project-ops = { path = "../../crates/project-ops" }
leptos = { version = "0.8", features = ["csr"] }
# Must match hexen-web's pin (and the flake's wasm-bindgen-cli).
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "Clipboard",
    "console",
    "DomException",
    "File",
    "FileList",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "Headers",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "UrlSearchParams",
    "Window",
    "WritableStream",
]
