[package]
name = "hex-enductor-desktop"
version = "0.0.0"
edition = "2021"
publish = false
description = "Hex Enductor as one desktop app: the editor in a native window, hexend running in-process, and the presentation view served to other windows and (opt-in) the LAN."

[lib]
name = "hex_enductor_desktop"
path = "src/lib.rs"

[[bin]]
name = "hex-enductor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hexend = { path = "../hexend" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread"] }
axum = "0.7"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
