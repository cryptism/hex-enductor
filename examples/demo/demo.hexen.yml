# yaml-language-server: $schema=../../docs/hexen.schema.json
schemaVersion: 1
title: Demo Realm
defaultLocation: town
content:
  type: obsidian
  vaultRoot: _vault
locations:
  - id: town
    grid:
      type: hex
      origin:
        x: 200
        y: 200
      b1:
        x: 60
        y: 0
      b2:
        x: 30
        y: 52
      distancePerCell: 1
      style:
        color: "#c19a5f"
        weight: 1
        opacity: 0.45
    image:
      file: _assets/town.png
      width: 400
      height: 400
    content:
      type: obsidian
      ref: town.md
    links:
      - id: inn-front-door
        target: inn
        x: 220
        y: 240
        type: settlement
        icon: tavern-sign
        color: null
        hidden: false
      - id: notice-board-pin
        target: notice-board
        x: 260
        y: 190
        type: landmark
        icon: wooden-sign
        color: null
        hidden: false
  - id: inn
    grid: null
    image: null
    content:
      type: obsidian
      ref: inn.md
    links: []
  - id: notice-board
    grid: null
    image: null
    content:
      type: inline
      title: The Notice Board
      body: A weathered board nailed up by the well, pinned with a dozen curling notices — mostly requests for a missing goat.
    links: []
