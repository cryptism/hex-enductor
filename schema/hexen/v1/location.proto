syntax = "proto3";

package hexen.v1;

import "hexen/v1/grid.proto";
import "hexen/v1/content.proto";

// A Location's own base map image, if it has one.
message ImageRef {
  // Path to the base map image, resolved relative to the .hexen.yml
  // file's own directory (not content.vault_root) — image storage is
  // decoupled from wherever the content plugin's root is.
  string file = 1;
  int32 width = 2;
  int32 height = 3;
}

// A pin on a parent Location's map: position and display only, never
// a title or summary — those live on the target Location's own
// content.
message Link {
  // This pin's own identity, stable across edits and independent of
  // what it points at — so a Location can be the target of more than
  // one Link (e.g. a front and back door into the same building).
  string id = 1;
  // The Location this pin points at.
  string target = 2;
  double x = 3;
  double y = 4;
  // Marker type, e.g. settlement/ruin/landmark/hazard/waypoint.
  string type = 5;
  optional string icon = 6;
  // Defaults to null (absent) when unset.
  optional string color = 7;
  // Defaults to false when absent.
  optional bool hidden = 8;
}

// A Location's fog-of-war state. Presence on a Location (even with no
// revealed cells) means fog is on; absence means the map is fully
// visible. Cell keys are opaque to the server — whatever addressing
// scheme the client's fog overlay uses (see
// packages/map-core/src/fog.ts) — so this message never needs to know
// the map's grid or image dimensions.
message FogOfWar {
  repeated string revealed_cells = 1;
}

// The one node type in the format. A Location becomes a map you can
// click into purely by having a grid, and a pin on someone else's map
// purely by being the target of a Link elsewhere — both, either, or
// neither can be true of the same Location at once.
message Location {
  string id = 1;
  Grid grid = 2;
  ImageRef image = 3;
  LocationContent content = 4;
  repeated Link links = 5;
  FogOfWar fog = 6;
}
