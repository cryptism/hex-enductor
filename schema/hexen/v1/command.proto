syntax = "proto3";

package hexen.v1;

import "hexen/v1/grid.proto";
import "hexen/v1/location.proto";

// A partial Link — only the fields present are meant to change.
// Mirrors LinkSchema.partial() in packages/hexen-schema. `icon` and
// `color` present but empty ("") clear the Link's own value, since
// proto3 JSON can't express "set this optional field to null".
message LinkPatch {
  optional string id = 1;
  optional string target = 2;
  optional double x = 3;
  optional double y = 4;
  optional string type = 5;
  optional string icon = 6;
  optional string color = 7;
  optional bool hidden = 8;
}

message SaveLinkCommand {
  string location_id = 1;
  string link_id = 2;
  LinkPatch patch = 3;
}

// A partial inline LocationContent — only title/body, since a command
// can't change a location's content *type*. Mirrors
// InlineLocationContentSchema.omit({type: true}).partial().
message InlineContentPatch {
  optional string title = 1;
  optional string body = 2;
}

message SaveLocationContentCommand {
  string location_id = 1;
  InlineContentPatch patch = 2;
}

// The pin's own marker type (settlement/ruin/landmark/...) is named
// `link_type` here, not `type` — `type` is already this command's own
// field name for reaching the Command oneof's discriminant.
message AddLocationLinkCommand {
  string parent_location_id = 1;
  string target_location_id = 2;
  double x = 3;
  double y = 4;
  string link_type = 5;
}

// Adds a new, bare Location — no grid, image, content, or links — not
// pinned from anywhere. Errors if a Location with this id already
// exists. The counterpart to AddLocationLinkCommand's own "create the
// target if it doesn't exist yet" behavior, for a map you want staged
// before it's linked in from anywhere.
message AddLocationCommand {
  string location_id = 1;
}

message SaveGridCommand {
  string location_id = 1;
  // Absent means "clear the grid" — mirrors GridSchema.nullable().
  Grid grid = 2;
}

message SaveImageCommand {
  string location_id = 1;
  // Absent means "remove the image" — mirrors ImageRefSchema.nullable().
  ImageRef image = 2;
}

// Absent fog means "turn fog off" — mirrors FogOfWarSchema.nullable().
// Present with no revealed cells starts fog with everything hidden.
message SetFogCommand {
  string location_id = 1;
  FogOfWar fog = 2;
}

// Sets a batch of opaque cell keys' revealed state explicitly (rather
// than toggling) so repeatedly painting over the same cell during a
// click-drag is idempotent. Plural rather than one-command-per-cell so
// a whole click-drag stroke lands (and broadcasts) as a single state
// change instead of flickering through one per cell. Errors if the
// location has no fog started yet — see SetFogCommand.
message SetFogCellsCommand {
  string location_id = 1;
  repeated string cells = 2;
  bool revealed = 3;
}

// Every interaction that mutates a HexenProject, as data — the same
// shape whether it arrives over hexend's WS session or is applied
// straight to an in-memory project by a local-fs storage backend.
message Command {
  oneof kind {
    SaveLinkCommand save_link = 1;
    SaveLocationContentCommand save_location_content = 2;
    AddLocationLinkCommand add_location_link = 3;
    SaveGridCommand save_grid = 4;
    SaveImageCommand save_image = 5;
    SetFogCommand set_fog = 6;
    SetFogCellsCommand set_fog_cells = 7;
    AddLocationCommand add_location = 8;
  }
}
