syntax = "proto3";

package hexen.v1;

import "hexen/v1/command.proto";
import "hexen/v1/project.proto";

// What a connected client sends over hexend's /ws session.
message ClientMessage {
  oneof kind {
    Command command = 1;
    Undo undo = 2;
    Redo redo = 3;
    Ping ping = 4;
    FollowView follow_view = 5;
  }
}

message Undo {}
message Redo {}

// Draws attention to a spot on a map — purely ephemeral, never applied
// to the project or persisted. hexend just re-broadcasts it verbatim
// to every socket watching this session (sender included), the same
// as a state broadcast but without touching state at all.
message Ping {
  string location_id = 1;
  double x = 2;
  double y = 3;
}

// The GM's own map view (pan + zoom), sent on every moveend/zoomend
// while Follow mode is on. Just as ephemeral as Ping — never applied
// to the project or persisted, hexend only ever re-broadcasts it.
message FollowView {
  string location_id = 1;
  double x = 2;
  double y = 3;
  double zoom = 4;
}

// A location's resolved title/summary/body, regardless of whether it
// came from inline content or an Obsidian vault file. Inline content
// never has a summary — only an Obsidian note's frontmatter can set one.
message ResolvedContent {
  string title = 1;
  optional string summary = 2;
  string body = 3;
}

// hexend's "state" broadcast — the same shape both the editor and the
// presentation app render from, whether it's the initial handshake or
// a broadcast after a command.
message OpenedProjectData {
  HexenProject project = 1;
  repeated string warnings = 2;
  map<string, ResolvedContent> resolved_content = 3;
  map<string, string> resolve_errors = 4;
}

// What hexend sends over /ws — either the project's state (initial
// handshake or after a command), a re-broadcast Ping, or a
// re-broadcast FollowView.
message ServerMessage {
  oneof kind {
    OpenedProjectData state = 1;
    Ping ping = 2;
    FollowView follow_view = 3;
  }
}
